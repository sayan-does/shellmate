name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --ignore=tests/unit/test_pipeline.py -x

      - name: Run pipeline unit tests
        run: python -m pytest tests/unit/test_pipeline.py -v -x

      - name: Run e2e tests
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest tests/e2e/ -v -x
