[pytest]
markers =
    windows: tests that run only on Windows
    linux: tests that run only on Linux
    autocomplete: tests for autocomplete mode (ble.sh, Linux only)
    intercept: tests for intercept mode (shell adapters)
    requires_api: tests that need real API keys
    slow: tests that take >10 seconds
    agentic: tests validating LangGraph/agent orchestration
    package_e2e: installed-wheel e2e tests (tests/e2e_package/)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*