- id: "rm_force_recursive_root"
  category: "file_deletion"
  severity: "CRITICAL"
  description: "Force recursive delete on root directory"
  program: "rm"
  flags:
    - "-rf"
    - "-fr"
  arguments:
    - "^/$"
  message: "This will recursively delete all files on the system without confirmation."
  confidence: 0.98

- id: "rm_force_recursive"
  category: "file_deletion"
