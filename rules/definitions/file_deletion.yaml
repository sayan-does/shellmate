  description: "Force recursive delete without confirmation"
  program: "rm"
  flags:
    - "-rf"
    - "-fr"
  message: "Recursively deletes files without confirmation. Consider using -ri for interactive deletion."
  confidence: 0.85

- id: "rm_force"
  category: "file_deletion"
