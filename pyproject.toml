[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellmate-cli"
version = "3.0.0"
description = "Intelligent shell autocomplete with consequence preview"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ShellMate Contributors"}
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.4.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "watchdog>=4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest", "pytest-asyncio"]
# Windows interactive-adapter test harness (Series F ConPTY automation)
windows-test = ["pywinpty>=2.0.0; sys_platform == 'win32'", "pyte>=0.8.1"]

[project.urls]
Homepage = "https://github.com/sayan-does/shellmate"
Repository = "https://github.com/sayan-does/shellmate"

[project.scripts]
sm = "shellmate.cli.main:main"
shellmate = "shellmate.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shellmate*"]

[tool.setuptools.package-data]
"shellmate" = [
    "adapters/*.sh",
    "adapters/*.zsh",
    "adapters/*.ps1",
    "agents/*.yaml",
    "rules/*.yaml",
    "rules/definitions/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
